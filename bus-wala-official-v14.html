<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>बस वाला (Bus Wala) — Window Seat, Purane Gane</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gotu&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@500;600;700;800;900&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-gold: #f5c518;
      --accent-amber: #ff9f1c;
      --brass-border: rgba(245, 197, 24, 0.32);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b16;
      font-family: 'Poppins', sans-serif;
      color: #f8fafc;
    }

    .font-hindi {
      font-family: 'Noto Sans Devanagari', 'Gotu', sans-serif;
    }

    .font-mono-clock {
      font-family: 'JetBrains Mono', monospace;
    }

    .font-serif-italic {
      font-family: 'Playfair Display', Georgia, serif;
    }

    /* Subtle Hero Title Glow */
    .title-glow {
      text-shadow:
        0 4px 24px rgba(0, 0, 0, 0.9),
        0 0 36px rgba(245, 197, 24, 0.16);
    }

    /* Simple, Frameless & Elegant Floating Top-Left Timepiece */
    .elegant-time-display {
      text-shadow:
        0 2px 14px rgba(0, 0, 0, 0.85),
        0 0 24px rgba(245, 197, 24, 0.14);
    }

    /* Horn OK Please & Action Pill Buttons */
    .horn-pill {
      background: rgba(14, 16, 24, 0.9);
      border: 1px solid rgba(245, 197, 24, 0.32);
      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.65),
        0 0 20px rgba(245, 197, 24, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .horn-pill:hover {
      transform: translateY(-2px) scale(1.03);
      border-color: rgba(245, 197, 24, 0.7);
      box-shadow:
        0 14px 30px rgba(0, 0, 0, 0.8),
        0 0 28px rgba(245, 197, 24, 0.28);
    }

    .horn-pill:active, .horn-pill.honking {
      transform: scale(0.95);
      border-color: #f5c518;
      box-shadow: 0 0 35px rgba(245, 197, 24, 0.65);
    }

    /* Ultra-Sleek Dark Obsidian Frosted-Glass Music Player Dock */
    .luxury-player-deck {
      background: linear-gradient(165deg, rgba(16, 18, 26, 0.92) 0%, rgba(8, 9, 14, 0.96) 100%);
      border: 1px solid rgba(245, 197, 24, 0.24);
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.95),
        0 0 0 1px rgba(255, 255, 255, 0.04),
        0 8px 32px rgba(245, 197, 24, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    /* Spinning Vinyl Album Art */
    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .vinyl-disc {
      animation: spinVinyl 7s linear infinite;
      animation-play-state: paused;
    }

    .is-playing-music .vinyl-disc {
      animation-play-state: running;
    }

    /* Golden Sliders */
    .bus-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.14);
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .bus-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #f5c518;
      border: 2px solid #fffbeb;
      box-shadow: 0 0 12px rgba(245, 197, 24, 0.95);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .bus-slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .bus-slider::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 2px solid #fffbeb;
      border-radius: 50%;
      background: #f5c518;
      box-shadow: 0 0 12px rgba(245, 197, 24, 0.95);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    /* Gentle Curtain Flutter Animation inside Windows */
    @keyframes curtainFlutter {
      0%, 100% { transform: skewX(0deg) scaleY(1); }
      50% { transform: skewX(-4deg) scaleY(0.98); }
    }

    .curtain-flutter {
      transform-origin: top center;
      transform-box: fill-box;
      animation: curtainFlutter 1.6s ease-in-out infinite;
      animation-play-state: paused;
    }

    .is-moving .curtain-flutter {
      animation-play-state: running;
    }

    /* Gentle Passenger Sway */
    @keyframes passengerSway {
      0%, 100% { transform: translateX(0px) rotate(0deg); }
      50% { transform: translateX(-1px) rotate(-1deg); }
    }

    .passenger-sway {
      transform-origin: bottom center;
      transform-box: fill-box;
      animation: passengerSway 2.6s ease-in-out infinite;
      animation-play-state: paused;
    }

    .is-moving .passenger-sway {
      animation-play-state: running;
    }

    /* Cutting Chai Steam Animation in Window Seat View */
    @keyframes steamRise {
      0% { transform: translateY(0) scaleX(1); opacity: 0.75; }
      50% { transform: translateY(-14px) scaleX(1.18); opacity: 0.45; }
      100% { transform: translateY(-28px) scaleX(0.9); opacity: 0; }
    }

    .chai-steam-1 { animation: steamRise 2.4s ease-out infinite; }
    .chai-steam-2 { animation: steamRise 2.4s ease-out 0.8s infinite; }
    .chai-steam-3 { animation: steamRise 2.4s ease-out 1.6s infinite; }

    /* Custom Scrollbar */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(245, 197, 24, 0.35);
      border-radius: 999px;
    }


    /* Responsive comfort and motion preferences */
    button, input { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid #f5c518;
      outline-offset: 3px;
    }
    @media (max-width: 640px) {
      body, html { overflow: hidden; width: 100%; height: 100%; }
      header.fixed.top-0 { padding: max(8px, env(safe-area-inset-top)) 10px 0; flex-wrap: wrap; align-items: flex-start; gap: 7px; }
      header.fixed.top-0 > div:first-child { max-width: 48%; }
      header.fixed.top-0 > div:first-child #clockDayDate { font-size: 8px; letter-spacing: 0; }
      header.fixed.top-0 > div:last-child { width: 100%; justify-content: space-around; gap: 4px; padding: 7px 6px; border-radius: 16px; background: rgba(5, 8, 18, .82); }
      header.fixed.top-0 > div:last-child button { min-width: 0; flex: 1 1 0; }
      header.fixed.top-0 > div:last-child button > span { font-size: 8px; letter-spacing: 0; }
      header.fixed.top-0 > div:last-child button > div { width: 30px; height: 30px; }
      #heroHeaderSection { top: clamp(112px, 18vh, 155px); padding-left: 10px; padding-right: 10px; }
      #heroHeaderSection h1 { font-size: clamp(2rem, 9vw, 3rem); }
      #heroHeaderSection p { font-size: 8px; letter-spacing: .16em; }
      #heroHeaderSection .mt-3, #heroHeaderSection .mt-3\.5 { margin-top: 8px; }
      #busStageWrapper { bottom: 24%; padding-inline: 0; transform: scale(.88); transform-origin: bottom center; }
      #windowSeatInteriorOverlay { z-index: 25; }
      #interiorCabinFrame { width: 100%; height: 100%; }
      #playerDeckSection { bottom: max(7px, env(safe-area-inset-bottom)); padding-inline: 8px; }
      .luxury-player-deck { padding: 10px 11px; border-radius: 18px; gap: 8px; background: rgba(7, 10, 20, .9); backdrop-filter: blur(18px); }
      #albumThumb { width: 42px; }
      #trackTitleEl { font-size: 11px; }
      #trackArtistEl { font-size: 9px; }
      #prevBtn, #playPauseBtn, #nextBtn { min-width: 32px; min-height: 32px; }
    }
    @media (max-width: 380px) {
      header.fixed.top-0 > div:last-child button > span { font-size: 7px; }
      #heroHeaderSection { top: 116px; }
      #heroHeaderSection .pointer-events-auto { gap: 7px; }
      #busStageWrapper { bottom: 26%; transform: scale(.78); }
      #trackArtistEl { max-width: 120px; }
      #topWindowSeatBtn, #rainToggleBtn, #ambientToggleBtn, #topPlaylistsBtn { padding: 2px; }
      #heroHeaderSection .pointer-events-auto button { min-height: 36px; }

    }
    /* Portrait-first Window Seat layout: keep the cabin labels readable on phones. */
    .mobile-window-seat-ui { display: none; }
    @media (max-width: 640px) {
      #interiorCabinFrame > svg { display: none; }
      .mobile-window-seat-ui { display: block; position: absolute; inset: 0; overflow: hidden; }
      .mobile-seat-sign {
        position: absolute; top: max(12vh, calc(env(safe-area-inset-top) + 90px)); left: 50%; transform: translateX(-50%);
        width: min(90vw, 430px); padding: 10px 12px; border: 1px solid rgba(245,197,24,.78); border-radius: 10px;
        color: #ffe7a0; text-align: center; font-family: 'Noto Sans Devanagari', sans-serif; font-size: clamp(12px, 3.4vw, 15px); font-weight: 800;
        line-height: 1.5; letter-spacing: .01em; background: linear-gradient(135deg, rgba(48,25,13,.97), rgba(18,12,10,.97));
        box-shadow: 0 5px 22px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.08); z-index: 2;
      }
      .mobile-seat-caption { display:block; margin-top: 2px; font-family: 'Poppins',sans-serif; font-size: 9px; font-weight: 500; color: #d6c6aa; letter-spacing: .12em; text-transform: uppercase; }
      .mobile-seat-window {
        position: absolute; top: 23%; left: 5%; width: 90%; height: 41%; border: 5px solid #b98536; border-radius: 23px;
        box-shadow: 0 0 0 4px #17100b, 0 0 0 7px rgba(245,197,24,.45), 0 0 0 200vmax rgba(22,13,8,.88), inset 0 0 28px rgba(8,18,30,.18);
        pointer-events: none; z-index: 1;
      }
      .mobile-seat-window::before { content:''; position:absolute; left:0; right:0; top:58%; height:5px; background:linear-gradient(#cbd5e1,#475569); box-shadow:0 1px 2px #000; }
      .mobile-seat-window::after { content:''; position:absolute; left:0; right:0; top:73%; height:2px; background:rgba(203,213,225,.65); box-shadow:0 34px rgba(203,213,225,.55); }
      .mobile-seat-curtain { position:absolute; top:23%; height:41%; width:13%; z-index:2; pointer-events:none; background:linear-gradient(90deg,#7c2d12,#c2410c 55%,#8b3518); border:1px solid rgba(245,197,24,.55); box-shadow:inset 0 0 12px rgba(0,0,0,.3); }
      .mobile-seat-curtain.left { left:5%; border-radius:18px 4px 4px 18px; clip-path:polygon(0 0,100% 0,82% 35%,100% 100%,0 100%); }
      .mobile-seat-curtain.right { right:5%; border-radius:4px 18px 18px 4px; clip-path:polygon(0 0,100% 0,100% 100%,0 100%,18% 40%); }
      .mobile-seat-sill { position:absolute; z-index:2; top:64.3%; left:3%; width:94%; height:18px; border-radius:4px 4px 10px 10px; background:linear-gradient(#6b4223,#2a170c); border:1px solid #9b652c; box-shadow:0 8px 20px rgba(0,0,0,.35); }
      .mobile-seat-actions { position:absolute; z-index:3; top:68%; left:5%; right:5%; display:flex; align-items:center; justify-content:space-between; gap:10px; }
      .mobile-seat-action { min-height:44px; display:flex; align-items:center; justify-content:center; gap:7px; padding:10px 12px; border:1px solid rgba(245,197,24,.5); border-radius:14px; background:rgba(12,15,23,.92); color:#fff4d2; font:600 12px 'Poppins',sans-serif; box-shadow:0 5px 16px rgba(0,0,0,.28); touch-action:manipulation; }
      .mobile-seat-action:active { transform:scale(.98); }
      .mobile-seat-actions .chai-action { color:#ffdda0; border-color:rgba(217,119,6,.65); }
      #playerDeckSection { z-index: 35; }
    }
    @media (max-width: 380px) {
      .mobile-seat-sign { top: max(11vh, calc(env(safe-area-inset-top) + 86px)); padding:8px 9px; }
      .mobile-seat-window { top:24%; height:39%; }
      .mobile-seat-curtain { top:24%; height:39%; }
      .mobile-seat-sill { top:63.5%; }
      .mobile-seat-actions { top:67%; gap:7px; }
      .mobile-seat-action { padding:9px 8px; font-size:11px; }
    }

    /* Mobile: compact breadcrumb-style controls; keep the retro desktop layout unchanged. */
    @media (max-width: 640px) {
      header.fixed.top-0 { display:block; padding:0; height:0; z-index:45; }
      header.fixed.top-0 > div:first-child { position:fixed; top:max(8px, env(safe-area-inset-top)); right:10px; left:auto; align-items:flex-end; }
      header.fixed.top-0 > div:first-child #clockHourMin { font-size:17px; }
      header.fixed.top-0 > div:first-child #clockDayDate,
      header.fixed.top-0 > div:first-child .text-\[\#f5c518\] { display:none; }
      #onlineCounterGroup { position:fixed; top:max(9px, env(safe-area-inset-top)); left:9px; right:auto; z-index:46; align-items:flex-start; margin:0; }
      #onlineCounterGroup > div:first-child { padding:5px 8px; font-size:9px; }
      #highwayToast { display:none; }
      header.fixed.top-0 > div:last-child {
        position:fixed; top:49px; left:8px; right:8px; width:auto; z-index:46;
        display:flex; justify-content:space-around; gap:4px; padding:5px 6px;
        border-radius:14px; background:rgba(7,10,20,.82); border:1px solid rgba(245,197,24,.24);
        box-shadow:0 6px 18px rgba(0,0,0,.25); backdrop-filter:blur(16px); overflow-x:auto;
      }
      header.fixed.top-0 > div:last-child button {
        display:flex; flex:1 0 auto; flex-direction:row; align-items:center; justify-content:center;
        min-height:34px; padding:6px 8px; border-radius:10px; background:rgba(255,255,255,.035);
        border:1px solid rgba(255,255,255,.07); gap:0; white-space:nowrap;
      }
      header.fixed.top-0 > div:last-child button > div { display:none; }
      header.fixed.top-0 > div:last-child button > span { font-size:10px; letter-spacing:0; color:#e5e7eb; }
      #heroHeaderSection { top:110px; }
      #windowSeatInteriorOverlay { z-index:42; pointer-events:none; }
      #interiorCabinFrame { pointer-events:none; }
      .mobile-window-seat-ui { pointer-events:none; }
      .mobile-seat-actions { pointer-events:auto; z-index:48; top:69%; }
      .mobile-seat-action { pointer-events:auto; position:relative; z-index:49; min-width:124px; }
      .mobile-seat-cup { pointer-events:none; position:absolute; z-index:4; top:57%; right:15%; width:58px; height:72px; filter:drop-shadow(0 7px 7px rgba(0,0,0,.6)); }
      .mobile-seat-cup .cup-body { position:absolute; bottom:8px; left:9px; width:34px; height:39px; border:2px solid rgba(255,245,220,.92); border-radius:4px 4px 11px 11px; background:linear-gradient(90deg,rgba(255,255,255,.2),#b96a22 38%,#f2b34b 65%,#6f3416); box-shadow:inset 0 3px 0 rgba(255,255,255,.3); }
      .mobile-seat-cup .cup-rim { position:absolute; top:22px; left:8px; width:36px; height:8px; border-radius:50%; background:#fef3c7; border:2px solid #e5e7eb; }
      .mobile-seat-cup .cup-handle { position:absolute; top:31px; left:38px; width:13px; height:19px; border:3px solid #e5e7eb; border-left:0; border-radius:0 10px 10px 0; }
      .mobile-seat-cup .steam { position:absolute; top:0; left:17px; width:22px; height:24px; border-left:2px solid rgba(255,255,255,.75); border-radius:50%; transform:rotate(18deg); animation:chaiSteamRise 2s ease-in-out infinite; }
      .mobile-seat-cup .steam.two { left:29px; top:3px; animation-delay:.65s; }
      @keyframes chaiSteamRise { 0%,100% { opacity:.25; transform:translateY(5px) rotate(18deg) scale(.9); } 50% { opacity:.9; transform:translateY(-4px) rotate(-10deg) scale(1.05); } }
      #playerDeckSection { z-index:50; }
    }
    @media (max-width: 380px) {
      header.fixed.top-0 > div:last-child { left:5px; right:5px; gap:3px; padding:4px; }
      header.fixed.top-0 > div:last-child button { padding:6px 6px; }
      header.fixed.top-0 > div:last-child button > span { font-size:9px; }
      .mobile-seat-cup { right:12%; }
      .mobile-seat-actions { top:69%; gap:6px; }
      .mobile-seat-action { min-width:0; flex:1; padding:9px 6px; font-size:10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    }


  
    /* Bus headlights: gentle breathing + brighter flash on horn */
    @keyframes headlightBreathe { 0%,100% { opacity: .92; } 50% { opacity: 1; } }
    .bus-headlights { animation: headlightBreathe 3.2s ease-in-out infinite; transition: filter .18s ease; }
    .bus-headlights.high-beam { filter: brightness(1.55) saturate(1.1); }
    /* Tracks popup */
    #tracksModal .track-row { display:flex; align-items:center; gap:10px; width:100%; padding:7px 9px; border-radius:12px; border:1px solid transparent; text-align:left; cursor:pointer; transition: background .15s, border-color .15s; }
    #tracksModal .track-row:hover { background: rgba(255,255,255,.06); }
    #tracksModal .track-row.active { background: rgba(245,197,24,.10); border-color: rgba(245,197,24,.4); }
    #tracksModal .track-thumb { width:52px; height:39px; border-radius:8px; object-fit:cover; background:#111827; flex:none; }
    @media (max-width: 640px) {
      #tracksModal { align-items: flex-end; padding: 0; }
      #tracksModal > div { max-height: 82dvh; border-radius: 22px 22px 0 0; padding-bottom: max(14px, env(safe-area-inset-bottom)); }
    }
    /* Hidden YouTube engine: audio only, UI lives in the dock */
    #ytEngineHost { position: fixed; right: 0; bottom: 0; width: 200px; height: 200px; opacity: 0.01; pointer-events: none; overflow: hidden; z-index: -1; }
</style>
</head>
<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- ===================================================================== -->
  <!-- 1. FULL-SCREEN NIGHT HIGHWAY PARALLAX SCENE CANVAS                    -->
  <!-- ===================================================================== -->
  <canvas id="highwaySceneCanvas" class="fixed inset-0 w-full h-full z-0 pointer-events-none"></canvas>

  <!-- ===================================================================== -->
  <!-- 2. TOP HEADER BAR (Simple Elegant Time + Day/Date, Online & Controls) -->
  <!-- ===================================================================== -->
  <header class="fixed top-0 inset-x-0 z-30 flex items-start justify-between px-4 sm:px-7 py-3.5 text-xs pointer-events-none">

    <!-- TOP LEFT: Simple, Frameless & Elegant Timepiece with Day, Date & Speed -->
    <div class="pointer-events-auto flex flex-col items-start select-none">
      <!-- Primary Time Line: e.g. 4:35 51 pm -->
      <div class="flex items-baseline gap-1 elegant-time-display">
        <span id="clockHourMin" class="font-mono-clock text-xl sm:text-2xl font-semibold text-white tracking-tight leading-none">
          3:31
        </span>
        <sup id="clockSec" class="font-mono-clock text-[10px] sm:text-[11px] font-semibold text-[#f5c518] -top-2 relative ml-0.5">
          51
        </sup>
        <span id="clockAmPm" class="font-mono-clock text-xs sm:text-sm font-medium text-slate-300/90 lowercase ml-0.5">
          pm
        </span>
      </div>

      <!-- Day & Date + Subtle Interactive Date -->
      <div class="flex items-center gap-2 mt-1 text-[10px] sm:text-[11px] text-slate-300/85 font-medium tracking-wide drop-shadow-[0_2px_6px_rgba(0,0,0,0.9)]">
        <span id="clockDayDate" class="text-slate-200/90">Tuesday, 27 Oct 2026</span>
      </div>
    </div>

    <!-- TOP CENTER: Live Online Passengers Indicator + Route Toast -->
    <div id="onlineCounterGroup" class="pointer-events-auto flex flex-col items-center gap-1.5 mt-0.5">
      <div class="flex items-center gap-2 px-3 py-1 rounded-full bg-slate-950/60 border border-white/10 backdrop-blur-md font-mono-clock text-[11px] text-slate-300/90 shadow-lg">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-400"></span>
        </span>
        <span><strong id="onlineCount" class="font-semibold text-white">—</strong> online</span>
      </div>
      <!-- Dynamic Toast Notification Banner -->
      <div id="highwayToast" class="opacity-0 transition-opacity duration-300 px-3 py-1 rounded-full bg-amber-500/20 border border-amber-400/50 text-amber-200 text-[10px] font-medium shadow-lg backdrop-blur-md">
        Route: NH-48 Desert Moonlit Highway
      </div>
    </div>

    <!-- TOP RIGHT: Interactive Controls (Window, Baarish, NH-48, Playlists) -->
    <div class="pointer-events-auto flex items-center gap-2.5 sm:gap-3.5 bg-slate-950/65 border border-white/10 backdrop-blur-md px-3 py-1.5 rounded-2xl shadow-xl">

      <!-- 1. Window Seat POV Toggle Button -->
      <button id="topWindowSeatBtn" title="Switch between Outside Bus View & Inside Window Seat View (Shortcut: W)" class="group flex flex-col items-center gap-0.5 text-slate-300 hover:text-amber-300 transition-colors focus:outline-none">
        <div id="windowSeatIconBox" class="w-7 h-7 rounded-lg bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-amber-400/60 transition-colors">
          <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 fill-none stroke-current" stroke-width="2">
            <rect x="3" y="4" width="18" height="16" rx="2" />
            <line x1="12" y1="4" x2="12" y2="20" />
            <line x1="3" y1="14" x2="21" y2="14" />
          </svg>
        </div>
        <span id="windowSeatBtnLabel" class="text-[8.5px] tracking-wide text-slate-400 group-hover:text-amber-300">Window</span>

      function initAudio() {
        if (!audioCtx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioCtx();

          masterGain = audioCtx.createGain();
          masterGain.gain.value = isMuted ? 0 : masterVol;

          analyser.fftSize = 64;
          analyser.smoothingTimeConstant = 0.78;

          reverbNode = createReverbImpulse(audioCtx, 2.2, 2.2);
          const reverbWet = audioCtx.createGain();
          reverbWet.gain.value = 0.32;

          masterGain.connect(analyser);
          reverbNode.connect(reverbWet);
          reverbWet.connect(masterGain);
          analyser.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

      function createReverbImpulse(ac, seconds, decay) {
        const conv = ac.createConvolver();
        const rate = ac.sampleRate;
        const len = rate * seconds;
        const buf = ac.createBuffer(2, len, rate);
        for (let c = 0; c < 2; c++) {
          const ch = buf.getChannelData(c);
          for (let i = 0; i < len; i++) {
            ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
          }
        }
        conv.buffer = buf;
        return conv;
      }

      function playAirBrakeHiss() {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const bufSize = Math.floor(audioCtx.sampleRate * 0.4);
        const noiseBuf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
        const data = noiseBuf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufSize, 1.8);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = noiseBuf;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2600, now);
        filter.Q.value = 1.6;

        const env = audioCtx.createGain();
        env.gain.setValueAtTime(0.11, now);
        env.gain.exponentialRampToValueAtTime(0.001, now + 0.38);

        src.connect(filter);
        filter.connect(env);
        env.connect(masterGain);
        src.start(now);
      }

      function playGearShiftRev() {

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();

        const env = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(50, now);
        osc.frequency.exponentialRampToValueAtTime(76, now + 0.25);
        osc.frequency.exponentialRampToValueAtTime(58, now + 0.55);

        filter.type = 'lowpass';
        filter.frequency.value = 170;

        env.gain.setValueAtTime(0.001, now);
        env.gain.linearRampToValueAtTime(0.08, now + 0.08);
        env.gain.exponentialRampToValueAtTime(0.001, now + 0.55);

        osc.connect(filter);
        filter.connect(env);
        env.connect(masterGain);
        osc.start(now);
        osc.stop(now + 0.58);
      }

      // 90s Bollywood Expressive Lead & Santoor Synthesizer
      let prevLeadFreq = null;

      function play90sLeadNote(freq, durationSec, style = 'fluteStrings') {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const filter = audioCtx.createBiquadFilter();
        const env = audioCtx.createGain();

        if (style === 'santoorGuitar') {
          osc1.type = 'triangle';
          osc2.type = 'sine';
          osc1.frequency.setValueAtTime(freq, now);
          osc2.frequency.setValueAtTime(freq * 2, now);
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(freq * 6, now);

          env.gain.setValueAtTime(0.001, now);
          env.gain.linearRampToValueAtTime(0.18, now + 0.012);
          env.gain.exponentialRampToValueAtTime(0.0008, now + durationSec * 1.15);
        } else {
          osc1.type = 'sawtooth';
          osc2.type = 'triangle';

          const startF = prevLeadFreq ? prevLeadFreq : freq * 0.985;
          osc1.frequency.setValueAtTime(startF, now);
          osc1.frequency.exponentialRampToValueAtTime(freq, now + 0.09);
          osc2.frequency.setValueAtTime(freq * 2.002, now);

          const vib = audioCtx.createOscillator();
          const vibGain = audioCtx.createGain();
          vib.frequency.value = 5.4;
          vibGain.gain.value = freq * 0.011;
          vib.connect(vibGain);
          vibGain.connect(osc1.frequency);
          vib.start(now);
          vib.stop(now + durationSec + 0.1);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(freq * 4.5, now);
          filter.Q.value = 1.8;

          env.gain.setValueAtTime(0.001, now);
          env.gain.linearRampToValueAtTime(0.15, now + 0.08);
          env.gain.setValueAtTime(0.13, now + Math.max(0.09, durationSec - 0.12));
          env.gain.exponentialRampToValueAtTime(0.0008, now + durationSec + 0.08);
        }

        prevLeadFreq = freq;

        osc1.connect(filter);
        osc2.connect(filter);
        filter.connect(env);
        env.connect(masterGain);
        env.connect(reverbNode);

        osc1.start(now);
        osc2.start(now);
        osc1.stop(now + durationSec + 0.12);
        osc2.stop(now + durationSec + 0.12);
      }

      function play90sBackingPad(rootFreq, durationSec) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        [rootFreq * 0.5, rootFreq * 0.75, rootFreq].forEach((f, idx) => {
          const osc = audioCtx.createOscillator();
          const filter = audioCtx.createBiquadFilter();
          const env = audioCtx.createGain();

          osc.type = idx === 0 ? 'sine' : 'sawtooth';
          osc.frequency.setValueAtTime(f, now);

          filter.type = 'lowpass';
          filter.frequency.value = 650;

          const peak = idx === 0 ? 0.13 : 0.045;
          env.gain.setValueAtTime(0.001, now);
          env.gain.linearRampToValueAtTime(peak, now + 0.25);
          env.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);

          osc.connect(filter);
          filter.connect(env);
          env.connect(masterGain);
          env.connect(reverbNode);

          osc.start(now);
          osc.stop(now + durationSec + 0.05);
        });
      }

      function playDholakBeat(type, rootFreq) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'dha' || type === 'ghe') {
          const bassOsc = audioCtx.createOscillator();
          const bassEnv = audioCtx.createGain();
          bassOsc.type = 'sine';
          bassOsc.frequency.setValueAtTime(92, now);
          bassOsc.frequency.exponentialRampToValueAtTime(128, now + 0.07);
          bassOsc.frequency.exponentialRampToValueAtTime(68, now + 0.28);

          bassEnv.gain.setValueAtTime(0.001, now);
          bassEnv.gain.linearRampToValueAtTime(0.20, now + 0.012);
          bassEnv.gain.exponentialRampToValueAtTime(0.001, now + 0.30);

          bassOsc.connect(bassEnv);
          bassEnv.connect(masterGain);
          bassOsc.start(now);
          bassOsc.stop(now + 0.32);
        }

        if (type === 'dha' || type === 'na' || type === 'ti') {
          const chantiOsc = audioCtx.createOscillator();
          const chantiEnv = audioCtx.createGain();
          chantiOsc.type = 'triangle';
          chantiOsc.frequency.setValueAtTime(rootFreq * (type === 'ti' ? 1.5 : 2.0), now);

          chantiEnv.gain.setValueAtTime(0.001, now);
          chantiEnv.gain.linearRampToValueAtTime(0.09, now + 0.006);
          chantiEnv.gain.exponentialRampToValueAtTime(0.0008, now + 0.18);

          chantiOsc.connect(chantiEnv);
          chantiEnv.connect(masterGain);
          chantiEnv.connect(reverbNode);
          chantiOsc.start(now);
          chantiOsc.stop(now + 0.20);
        }
      }

      function toggleMonsoonRain() {
        initAudio();
        monsoonRainOn = !monsoonRainOn;

        if (monsoonRainOn) {
          rainBtnLabel.textContent = 'Rain: ON';
          rainBtnLabel.classList.add('text-cyan-300');
          document.getElementById('rainIconBox').classList.add('border-cyan-400/60', 'bg-cyan-500/15');
          showHighwayToast('Monsoon Night Rain: ON 🌧️');

          // Realistic monsoon rain: layered body + patter + roof drops + distant thunder
          const sr = audioCtx.sampleRate;
          const mkNoise = (secs, pink) => {
            const buf = audioCtx.createBuffer(2, sr * secs, sr);
            for (let c = 0; c < 2; c++) {
              const out = buf.getChannelData(c);
              let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
              for (let i = 0; i < out.length; i++) {
                const white = Math.random() * 2 - 1;
                if (pink) {
                  b0 = 0.99886 * b0 + white * 0.0555179; b1 = 0.99332 * b1 + white * 0.0750759;
                  b2 = 0.96900 * b2 + white * 0.1538520; b3 = 0.86650 * b3 + white * 0.3104856;
                  b4 = 0.55000 * b4 + white * 0.5329522; b5 = -0.7616 * b5 - white * 0.0168980;
                  out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
                  b6 = white * 0.115926;
                } else out[i] = white;
              }
            }
            return buf;
          };
          const rainBus = audioCtx.createGain();
          rainBus.gain.value = 0.0001;
          rainBus.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 2.5);
          rainBus.connect(masterGain);
          const rainNodes = [];
          const rainTimers = [];
          const addLoop = (buf) => { const n = audioCtx.createBufferSource(); n.buffer = buf; n.loop = true; rainNodes.push(n); return n; };

          // (a) deep steady body of the downpour
          const body = addLoop(mkNoise(4, true));
          const bodyLP = audioCtx.createBiquadFilter(); bodyLP.type = 'lowpass'; bodyLP.frequency.value = 1400;
          const bodyG = audioCtx.createGain(); bodyG.gain.value = 0.34;
          body.connect(bodyLP); bodyLP.connect(bodyG); bodyG.connect(rainBus);

          // (b) bright patter that swells and fades like gusts of wind
          const patter = addLoop(mkNoise(3, false));
          const patBP = audioCtx.createBiquadFilter(); patBP.type = 'bandpass'; patBP.frequency.value = 4200; patBP.Q.value = 0.55;
          const patHP = audioCtx.createBiquadFilter(); patHP.type = 'highpass'; patHP.frequency.value = 2200;
          const patG = audioCtx.createGain(); patG.gain.value = 0.085;
          const gust = audioCtx.createOscillator(); gust.frequency.value = 0.11;
          const gustAmt = audioCtx.createGain(); gustAmt.gain.value = 0.035;
          gust.connect(gustAmt); gustAmt.connect(patG.gain); rainNodes.push(gust);
          patter.connect(patBP); patBP.connect(patHP); patHP.connect(patG); patG.connect(rainBus);

          // (c) individual drops hitting the bus roof / puddles
          const dropBuf = mkNoise(1, false);
          const dropTimer = setInterval(() => {
            if (!audioCtx || audioCtx.state !== 'running') return;
            const n = 1 + (Math.random() * 3 | 0);
            for (let k = 0; k < n; k++) {
              if (Math.random() > 0.55) continue;
              const src = audioCtx.createBufferSource(); src.buffer = dropBuf;
              const bp = audioCtx.createBiquadFilter(); bp.type = 'bandpass';
              bp.frequency.value = 1500 + Math.random() * 4200; bp.Q.value = 3 + Math.random() * 5;
              const g = audioCtx.createGain(); const t0 = audioCtx.currentTime + Math.random() * 0.08;
              const peak = 0.05 + Math.random() * 0.11;
              g.gain.setValueAtTime(0.0001, t0);
              g.gain.exponentialRampToValueAtTime(peak, t0 + 0.004);
              g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.05 + Math.random() * 0.05);
              const pan = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
              src.connect(bp); bp.connect(g);
              if (pan) { pan.pan.value = Math.random() * 2 - 1; g.connect(pan); pan.connect(rainBus); } else g.connect(rainBus);
              src.start(t0, Math.random() * 0.8, 0.12);
            }
          }, 85);
          rainTimers.push(dropTimer);

          // (d) distant thunder rolling in now and then
          const thunderBuf = mkNoise(6, true);
          const scheduleThunder = () => {
            const tid = setTimeout(() => {
              if (!audioCtx || !monsoonRainOn) return;
              const src = audioCtx.createBufferSource(); src.buffer = thunderBuf;
              const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass';
              lp.frequency.setValueAtTime(260, audioCtx.currentTime);
              lp.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 4.5);
              const g = audioCtx.createGain(); const t0 = audioCtx.currentTime;
              g.gain.setValueAtTime(0.0001, t0);
              g.gain.linearRampToValueAtTime(0.75, t0 + 0.5);
              g.gain.setTargetAtTime(0.0001, t0 + 0.9, 1.1);
              src.connect(lp); lp.connect(g); g.connect(rainBus);
              src.start(t0); src.stop(t0 + 6);
              scheduleThunder();
            }, 12000 + Math.random() * 18000);
            rainTimers.push(tid);
          };
          scheduleThunder();

          body.start(); patter.start(); gust.start();
          rainAudioGain = rainBus;
          rainAudioGain._cleanup = () => {
            rainTimers.forEach((t) => { clearInterval(t); clearTimeout(t); });
            const t = audioCtx.currentTime;
            rainBus.gain.cancelScheduledValues(t);
            rainBus.gain.setTargetAtTime(0.0001, t, 0.25);
            setTimeout(() => {
              rainNodes.forEach((n) => { try { n.stop(); } catch (e) {} });
              try { rainBus.disconnect(); } catch (e) {}
            }, 1200);
          };
        } else {
          rainBtnLabel.textContent = 'Baarish';
          rainBtnLabel.classList.remove('text-cyan-300');
          document.getElementById('rainIconBox').classList.remove('border-cyan-400/60', 'bg-cyan-500/15');
          showHighwayToast('Monsoon Rain: OFF');
          if (rainAudioGain) {
            rainAudioGain._cleanup();
            rainAudioGain = null;
          }
        }
      }

      function startSynthSequencer() {
        stopSynthSequencer();
        const track = PLAYLIST[currentTrackIdx];
        if (!track || track.isCustomFile) return;

        initAudio();
        const stepMs = (60 / track.tempoBpm) * 1000 / 2;

        const tick = () => {
          if (!isPlaying) return;

          const b = beatStep % 8;
          if (b === 0) {
            playDholakBeat('dha', track.rootFreq);
            play90sBackingPad(track.rootFreq, (stepMs * 8) / 1000);
          } else if (b === 2 || b === 6) {
            playDholakBeat('na', track.rootFreq);
          } else if (b === 3 || b === 5) {
            playDholakBeat('ghe', track.rootFreq);
          } else if (b === 4) {
            playDholakBeat('ti', track.rootFreq);
          }

          if (ticksLeftInNote <= 0) {
            const mNote = track.melody[melodyStepIdx % track.melody.length];
            const ratio = track.scale[mNote.n] || 1;
            const freq = track.rootFreq * ratio;
            const durSec = (mNote.d * stepMs) / 1000;

            play90sLeadNote(freq, durSec, track.leadStyle);
            ticksLeftInNote = mNote.d;
            melodyStepIdx++;
          }

          ticksLeftInNote--;
          beatStep++;
        };

        tick();
        stepTimer = setInterval(tick, stepMs);
      }

      function stopSynthSequencer() {
        if (stepTimer) {
          clearInterval(stepTimer);
          stepTimer = null;
        }
      }

      function ytApplyVolume() {
        if (!ytReady) return;
        try {
          ytPlayer.setVolume(Math.round(masterVol * 100));
          if (isMuted) ytPlayer.mute(); else ytPlayer.unMute();
        } catch (_) {}

      function ytUpdateMeta() {
        if (!ytReady) return;
        try {
          const d = ytPlayer.getVideoData();
          if (d && d.title) {
            trackTitleEl.textContent = d.title;
            trackArtistEl.textContent = d.author || 'Bus Wala Official Playlist';
            if (d.video_id && typeof ytTitles !== 'undefined') { ytTitles[d.video_id] = { title: d.title, author: d.author || '' }; }
            if (typeof paintTracks === 'function') paintTracks();
            document.title = d.title + ' — बस वाला';
          }
          ytDuration = ytPlayer.getDuration() || 0;
        } catch (_) {}
      }

      let ytBufferSince = 0;
      function onYtState(e) {
        const S = window.YT.PlayerState;
        ytBufferSince = e.data === S.BUFFERING ? (ytBufferSince || Date.now()) : 0;
        if (e.data === S.PLAYING) {
          ytUpdateMeta();
          setPlayingUI(true);
        } else if (e.data === S.PAUSED) {
          // An ad or a track change can briefly report PAUSED; only show "paused" if the listener wanted that.
          if (!ytWantPlay) setPlayingUI(false);
        } else if (e.data === S.BUFFERING || e.data === S.CUED) {
          ytUpdateMeta();
        } else if (e.data === S.UNSTARTED) {
          if (ytWantPlay) { try { ytPlayer.playVideo(); } catch (_) {} }
        } else if (e.data === S.ENDED) {
          if (isRepeat) {
            try { ytPlayer.playVideoAt(ytPlayer.getPlaylistIndex()); } catch (_) {}
          } else if (ytWantPlay) {
            // Playlists normally auto-advance; if not, move on ourselves.
            setTimeout(() => {
              try { if (ytPlayer.getPlayerState() === window.YT.PlayerState.ENDED) ytPlayer.nextVideo(); } catch (_) {}
            }, 1500);
          }
        }
      }

      // Watchdog: keeps songs flowing one after another (after ads, skips, or a stalled load).
      setInterval(() => {
        if (!ytReady || !ytWantPlay) return;
        try {
          const S = window.YT.PlayerState;
          const st = ytPlayer.getPlayerState();
          if (st === S.UNSTARTED || st === S.CUED) ytPlayer.playVideo();
          else if (st === S.ENDED) ytPlayer.nextVideo();
          else if (st === S.PAUSED && !document.hidden) ytPlayer.playVideo();
          else if (st === S.BUFFERING && ytBufferSince && Date.now() - ytBufferSince > 15000) { ytBufferSince = 0; ytPlayer.nextVideo(); }
        } catch (_) {}
      }, 2500);

      function onYtError() {
        setPlayingUI(false);
        trackTitleEl.textContent = 'Song unavailable';
        trackArtistEl.textContent = 'Skipping to the next song…';
        // Embedding disabled / removed video: move on automatically.
        setTimeout(() => { try { ytPlayer.nextVideo(); } catch (_) {} }, 900);
      }

      function createYtPlayer() {
        if (ytPlayer) return;
        const vars = {
          listType: 'playlist', list: YT_PLAYLIST_ID,
          controls: 0, disablekb: 1, playsinline: 1, rel: 0, modestbranding: 1, iv_load_policy: 3, fs: 0
        };
        if (/^https?:/.test(location.protocol)) vars.origin = location.origin;
        ytPlayer = new window.YT.Player('ytPlayer', {
          host: 'https://www.youtube-nocookie.com',
          width: '200', height: '200',
          playerVars: vars,
          events: {
            onReady: () => {
              ytReady = true;
              ytApplyVolume();
              ytUpdateMeta();
              if (ytWantPlay) { try { ytPlayer.playVideo(); } catch (_) {} }
            },
            onStateChange: onYtState,
            onError: onYtError
          }
        });
      }

        window.onYouTubeIframeAPIReady = createYtPlayer;
        const tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';

          ytWantPlay = !ytWantPlay;
          setPlayingUI(ytWantPlay);
          trackTitleEl.textContent = ytWantPlay ? 'Loading playlist…' : 'Bus Wala Official Playlist';
          return;
        }
        try {
          const st = ytPlayer.getPlayerState();
          const playingNow = st === window.YT.PlayerState.PLAYING || st === window.YT.PlayerState.BUFFERING;
          if (playingNow) { ytWantPlay = false; ytPlayer.pauseVideo(); setPlayingUI(false); }
          else { ytWantPlay = true; ytPlayer.playVideo(); setPlayingUI(true); }
        } catch (_) {}
      }

      function ytPoll(now) {
        if (!ytReady || ytSeeking || now - ytLastPoll < 250) return;
        ytLastPoll = now;
        try {
          if (!ytDuration) ytDuration = ytPlayer.getDuration() || 0;
          currentTimeSec = ytPlayer.getCurrentTime() || 0;
          updateProgressUI(currentTimeSec, ytDuration);
        } catch (_) {}
      }

      function loadTrack(idx, autoPlay = true) {
        if (idx < 0) idx = PLAYLIST.length - 1;
        if (idx >= PLAYLIST.length) idx = 0;
        currentTrackIdx = idx;

        const track = PLAYLIST[currentTrackIdx];
        stopSynthSequencer();
        customAudioEl.pause();

        trackTitleEl.textContent = track.title;
        trackArtistEl.textContent = track.artist;
        currentTimeSec = 0;
        melodyStepIdx = 0;
        ticksLeftInNote = 0;
        beatStep = 0;

        if (track.isCustomFile) {
          customAudioEl.src = track.fileUrl;
          customAudioEl.load();
          customAudioEl.onloadedmetadata = () => {
            track.durationSec = customAudioEl.duration || 240;
            updateProgressUI(0, track.durationSec);
            if (autoPlay) {
              if (!isPlaying) togglePlayPause();
              else customAudioEl.play().catch(() => {});
            }
          };
        } else {
          updateProgressUI(0, track.durationSec);
          if (autoPlay) {
            if (!isPlaying) togglePlayPause();
            else startSynthSequencer();
          }
        }

        renderPlaylistItems();
      }

      function formatSec(sec) {
        if (!isFinite(sec) || sec < 0) return '0:00';

        const s = Math.floor(sec % 60);
        return `${m}:${String(s).padStart(2, '0')}`;

      function fetchTitle(id) {
        const watch = encodeURIComponent('https://www.youtube.com/watch?v=' + id);
        const urls = ['https://www.youtube.com/oembed?format=json&url=' + watch, 'https://noembed.com/embed?url=' + watch];
        return urls.reduce((p, u) => p.catch(() => fetch(u).then(r => r.json()).then(j => { if (!j.title) throw 0; return j; })), Promise.reject());

      function pumpTitles() {

            .finally(() => { titleBusy--; paintTracks(); pumpTitles(); });

      function drawScrollingMountainLayer(ctx, w, h, horizonY, offsetPx, points, fillStyle) {
        ctx.fillStyle = fillStyle;
        for (let tile = -1; tile <= 1; tile++) {
          const baseX = tile * w - (offsetPx % w);
          ctx.beginPath();
          ctx.moveTo(baseX, horizonY);
          points.forEach((pt) => {
            ctx.lineTo(baseX + pt[0] * w, pt[1] * h);
          });
          ctx.lineTo(baseX + w, horizonY);
          ctx.closePath();
          ctx.fill();
        }
      }

      function drawStylizedTree(ctx, x, groundY, scale) {
        ctx.save();
        ctx.translate(x, groundY);
        ctx.scale(scale, scale);

        ctx.fillStyle = 'rgba(10, 12, 16, 0.45)';
        ctx.beginPath();
        ctx.ellipse(0, 4, 36, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = '#2d211b';
        ctx.lineCap = 'round';
        ctx.lineWidth = 9;
        ctx.beginPath();
        ctx.moveTo(0, 2);
        ctx.lineTo(0, -45);
        ctx.stroke();

        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(0, -28);
        ctx.lineTo(-18, -48);
        ctx.moveTo(0, -32);
        ctx.lineTo(18, -50);
        ctx.stroke();

        const lobes = [
          { cx: -22, cy: -54, r: 20, c1: '#2f452d', c2: '#1a2819' },
          { cx: 22, cy: -52, r: 21, c1: '#2a3e28', c2: '#162215' },
          { cx: -10, cy: -70, r: 23, c1: '#385235', c2: '#1e2e1d' },
          { cx: 12, cy: -68, r: 22, c1: '#334b31', c2: '#1a2819' },
          { cx: 0, cy: -56, r: 24, c1: '#2d432b', c2: '#182417' }
        ];

        lobes.forEach((l) => {
          const grad = ctx.createRadialGradient(l.cx - l.r * 0.3, l.cy - l.r * 0.3, 2, l.cx, l.cy, l.r);
          grad.addColorStop(0, l.c1);
          grad.addColorStop(1, l.c2);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(l.cx, l.cy, l.r, 0, Math.PI * 2);
          ctx.fill();
        });

        ctx.restore();
      }

      function drawIndianMilestone(ctx, x, y, cityObj) {
        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.beginPath();
        ctx.ellipse(0, 2, 16, 4, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(-12, -26, 24, 26);

        ctx.fillStyle = '#f5c518';
        ctx.beginPath();
        ctx.arc(0, -26, 12, Math.PI, 0);
        ctx.lineTo(12, -18);
        ctx.lineTo(-12, -18);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.font = 'bold 6.5px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(cityObj.hi, 0, -21);
        ctx.font = 'bold 7.5px monospace';
        ctx.fillText(String(cityObj.km), 0, -10);
        ctx.font = '5px sans-serif';
        ctx.fillText('km', 0, -3);

        ctx.restore();
      }

      const freqBins = new Uint8Array(32);

      function renderMiniSpectrum(bassEnergy) {
        const mw = miniVisCanvas.width;
        const mh = miniVisCanvas.height;
        miniVisCtx.clearRect(0, 0, mw, mh);

        const barCount = 10;
        const barW = 3;
        const gap = 2;

        for (let i = 0; i < barCount; i++) {
          let val = 0.2;
          if (isPlaying) {
            // YouTube audio is cross-origin, so animate a lively equalizer instead of real FFT data.
            const t = performance.now() / 1000;
            val = 0.28 + 0.62 * Math.abs(Math.sin(t * (2.1 + i * 0.37) + i * 1.3)) * (0.7 + 0.3 * Math.sin(t * 0.9 + i));
          }
          const bh = Math.max(2, val * mh);
          const x = i * (barW + gap);
          const y = mh - bh;

          miniVisCtx.fillStyle = isPlaying ? '#f5c518' : 'rgba(148, 163, 184, 0.35)';
          miniVisCtx.fillRect(x, y, barW, bh);
        }
      }

      function animateHighway(now) {
        const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
        lastFrameTime = now;

        const w = canvas.width;
        const h = canvas.height;
        const route = HIGHWAY_ROUTES[currentRouteIdx];

        // 1. Update Song Playback Clock (from the YouTube player)
        ytPoll(now);

        // 2. BUS VELOCITY, ACCELERATION & SLOWER, SMOOTHER SUSPENSION PHYSICS
        if (hornSpeedBoost > 0) {
          hornSpeedBoost = Math.max(0, hornSpeedBoost - dt * 1.1);
        }

        if (isPlaying) {
          targetVelocity = (gearMode === 1 ? 1.45 : 1.0) + hornSpeedBoost;
        } else if (gearMode === 2) {
          targetVelocity = 1.1 + hornSpeedBoost;
        } else {
          targetVelocity = hornSpeedBoost;
        }

        // Smooth cushioned inertia acceleration / braking
        const accelRate = targetVelocity > busVelocity ? 1.1 : 1.4;
        busVelocity += (targetVelocity - busVelocity) * Math.min(1, dt * accelRate);
        if (busVelocity < 0.005 && targetVelocity === 0) busVelocity = 0;

        const isMovingNow = busVelocity > 0.08;
        busStageWrapper.classList.toggle('is-moving', isMovingNow);
        windowSeatInteriorOverlay.classList.toggle('is-moving', isMovingNow);

        // Update Live Speedometer UI
        const kmh = Math.round(busVelocity * 64);
        speedometerText.textContent = `${String(kmh).padStart(2, '0')} km/h`;
        speedStatusDot.className = `w-1.5 h-1.5 rounded-full ${
          kmh > 75 ? 'bg-emerald-400 animate-ping' : (kmh > 5 ? 'bg-amber-400' : 'bg-rose-500')
        }`;

        if (ambientBusGain && ambientBusGain._osc && audioCtx) {
          const targetPitch = 42 + busVelocity * 24;
          ambientBusGain._osc.frequency.setTargetAtTime(targetPitch, audioCtx.currentTime, 0.12);
        }

        // Compute Audio Bass Energy & Render Mini Spectrum
        let bassEnergy = 0;
        if (isPlaying && !analyser) {
          bassEnergy = 0.35 + 0.25 * Math.abs(Math.sin(now * 0.0075));
        } else if (analyser && isPlaying) {
          analyser.getByteFrequencyData(freqBins);
          let sum = 0;
          for (let i = 0; i < 12; i++) sum += freqBins[i];
          bassEnergy = sum / (12 * 255);
        }
        renderMiniSpectrum(bassEnergy);

        // Smooth Wheel Rotation (Zero high-frequency jitter!)
        wheelRotationDeg = (wheelRotationDeg + busVelocity * 480 * dt) % 360;
        const slowWheelFloatY = isMovingNow ? Math.sin(now * 0.0032) * 0.45 * Math.min(1.2, busVelocity) : 0;
        rearWheelRotor.setAttribute('transform', `rotate(${wheelRotationDeg.toFixed(1)})`);
        frontWheelRotor.setAttribute('transform', `rotate(${wheelRotationDeg.toFixed(1)})`);
        rearWheelMount.setAttribute('transform', `translate(367, ${(326 + slowWheelFloatY).toFixed(2)})`);
        frontWheelMount.setAttribute('transform', `translate(715, ${(326 - slowWheelFloatY * 0.7).toFixed(2)})`);

        // Slower, Gentler Highway Suspension Float (Low-frequency gentle sine wave)
        chassisPitchDeg += (0 - chassisPitchDeg) * Math.min(1, dt * 2.2);
        const gentleRoadWaveY = isMovingNow
          ? (Math.sin(now * 0.0022) * 1.15 + Math.sin(now * 0.0051) * 0.45) * Math.min(1.2, busVelocity)
          : Math.sin(now * 0.004) * 0.2;
        const dynamicPitch = chassisPitchDeg + (isMovingNow ? Math.cos(now * 0.002) * 0.12 * busVelocity : 0);

        busChassisGroup.setAttribute(
          'transform',
          `translate(0, ${gentleRoadWaveY.toFixed(2)}) rotate(${dynamicPitch.toFixed(2)}, 500, 300)`
        );
        busRoadShadow.setAttribute('rx', (342 + gentleRoadWaveY * 1.5).toFixed(1));

        // Gentle sway for Inside Window Seat Cabin Frame
        if (isWindowSeatView && interiorCabinFrame) {
          interiorCabinFrame.style.transform = `translateY(${(gentleRoadWaveY * 1.2).toFixed(2)}px)`;
        }

        if (rearMudflap) {
          const flapX = 316 - Math.min(12, busVelocity * 6 + Math.sin(now * 0.008) * 1.2 * busVelocity);
          rearMudflap.setAttribute('x2', flapX.toFixed(1));
        }

        // Spawn continuous exhaust puffs when moving
        exhaustSpawnTimer += dt * (0.6 + busVelocity * 4.2);
        if (exhaustSpawnTimer >= 1) {
          exhaustSpawnTimer = 0;
          spawnExhaustBurst(1);
        }

        // -----------------------------------------------------------------
        // LAYER 1: NIGHT SKY, MILKY WAY & SHOOTING STARS
        // -----------------------------------------------------------------
        const horizonY = h * 0.56;
        const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY);
        skyGrad.addColorStop(0, route.skyTop);
        skyGrad.addColorStop(0.55, route.skyMid);
        skyGrad.addColorStop(1, route.skyHorizon);
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, w, horizonY + 10);

        // Diagonal Milky Way Galactic Glow Band
        ctx.save();
        ctx.translate(w * 0.48, h * 0.16);
        ctx.rotate(-0.42);
        const milkyGrad = ctx.createRadialGradient(0, 0, 10, 0, 0, w * 0.36);
        milkyGrad.addColorStop(0, 'rgba(216, 180, 254, 0.14)');
        milkyGrad.addColorStop(0.45, 'rgba(125, 211, 252, 0.06)');
        milkyGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
        ctx.fillStyle = milkyGrad;
        ctx.fillRect(-w * 0.45, -h * 0.18, w * 0.9, h * 0.36);
        ctx.restore();

        // Twinkling Stars
        stars.forEach((st) => {
          st.x -= busVelocity * 0.004 * dt;
          if (st.x < 0) st.x += 1;
          const tw = 0.55 + 0.45 * Math.sin(now * 0.002 * st.twinkleSpeed + st.phase);
          ctx.fillStyle = st.color;
          ctx.globalAlpha = st.alpha * tw;
          ctx.beginPath();
          ctx.arc(st.x * w, st.y * h, st.r, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Occasional Shooting Stars
        if (Math.random() < 0.004 && shootingStars.length < 2) {
          shootingStars.push({
            x: (0.2 + Math.random() * 0.6) * w,
            y: (0.04 + Math.random() * 0.18) * h,
            vx: -380 - Math.random() * 180,
            vy: 140 + Math.random() * 90,
            life: 1.0
          });
        }
        for (let i = shootingStars.length - 1; i >= 0; i--) {
          const ss = shootingStars[i];
          ss.x += ss.vx * dt;
          ss.y += ss.vy * dt;
          ss.life -= dt * 1.6;
          if (ss.life <= 0) {
            shootingStars.splice(i, 1);
            continue;
          }
          const grad = ctx.createLinearGradient(ss.x, ss.y, ss.x - ss.vx * 0.12, ss.y - ss.vy * 0.12);
          grad.addColorStop(0, `rgba(255, 255, 255, ${ss.life})`);
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(ss.x, ss.y);
          ctx.lineTo(ss.x - ss.vx * 0.12, ss.y - ss.vy * 0.12);
          ctx.stroke();
        }

        // Drifting Nocturnal Clouds
        clouds.forEach((c) => {
          c.x -= (c.speed + busVelocity * 0.008) * dt;
          if (c.x < -0.35) c.x = 1.25;
          const cx = c.x * w;
          const cy = c.y * h;
          const cw = c.w * w;
          const ch = c.h * h;
          const cGrad = ctx.createRadialGradient(cx, cy, ch * 0.2, cx, cy, cw * 0.6);
          cGrad.addColorStop(0, 'rgba(51, 65, 85, 0.32)');
          cGrad.addColorStop(1, 'rgba(15, 23, 42, 0)');
          ctx.fillStyle = cGrad;
          ctx.beginPath();
          ctx.ellipse(cx, cy, cw * 0.6, ch, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // -----------------------------------------------------------------
        // LAYER 2: SCROLLING DUAL MOUNTAIN RANGES
        // -----------------------------------------------------------------
        farMtnOffset = (farMtnOffset + busVelocity * 16 * dt) % w;
        const farPeaks = [
          [0.0, 0.44], [0.14, 0.29], [0.28, 0.41], [0.42, 0.36],
          [0.58, 0.48], [0.74, 0.31], [0.89, 0.25], [1.0, 0.44]
        ];
        drawScrollingMountainLayer(ctx, w, h, horizonY, farMtnOffset, farPeaks, route.farMtn);

        midMtnOffset = (midMtnOffset + busVelocity * 38 * dt) % w;
        const midGrad = ctx.createLinearGradient(0, h * 0.32, 0, horizonY);
        midGrad.addColorStop(0, route.midMtnTop);
        midGrad.addColorStop(1, route.midMtnBot);
        const midPeaks = [
          [0.0, 0.49], [0.11, 0.38], [0.25, 0.46], [0.38, 0.42],
          [0.52, 0.51], [0.68, 0.39], [0.83, 0.34], [0.94, 0.45], [1.0, 0.49]
        ];
        drawScrollingMountainLayer(ctx, w, h, horizonY, midMtnOffset, midPeaks, midGrad);

        // -----------------------------------------------------------------
        // LAYER 3: DESERT / GHAT TERRAIN, POLES & TREES
        // -----------------------------------------------------------------
        const roadTopY = h * 0.72;
        const desertGrad = ctx.createLinearGradient(0, horizonY, 0, roadTopY);
        desertGrad.addColorStop(0, route.terrainTop);
        desertGrad.addColorStop(0.45, route.terrainMid);
        desertGrad.addColorStop(1, route.terrainBot);
        ctx.fillStyle = desertGrad;
        ctx.fillRect(0, horizonY - 2, w, roadTopY - horizonY + 4);

        // Roadside Silhouette Electricity Poles
        electricPoles.forEach((p) => {
          p.x -= busVelocity * 0.14 * dt;
          if (p.x < -0.2) p.x += 1.4;

          const px = p.x * w;
          const pyBottom = horizonY + (roadTopY - horizonY) * 0.55;
          const pyTop = horizonY - h * 0.08;

          ctx.strokeStyle = 'rgba(28, 25, 34, 0.85)';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(px, pyBottom);
          ctx.lineTo(px, pyTop);
          ctx.moveTo(px - 10, pyTop + 6);
          ctx.lineTo(px + 10, pyTop + 6);
          ctx.stroke();
        });

        // Scrub Bushes
        desertShrubs.forEach((b) => {
          b.x -= busVelocity * 0.15 * dt;
          if (b.x < -0.08) b.x = 1.12;

          const bx = b.x * w;
          const by = b.yRatio * h;
          ctx.fillStyle = '#253524';
          ctx.beginPath();
          ctx.ellipse(bx, by, b.r * 1.3, b.r * 0.8, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // Stylized Trees
        desertTrees.forEach((t) => {
          t.x -= busVelocity * 0.19 * dt;
          if (t.x < -0.15) t.x = 1.15;
          drawStylizedTree(ctx, t.x * w, t.yLayer * h, t.scale);
        });

        // -----------------------------------------------------------------
        // LAYER 4: PASSING INDIAN MILESTONES & METALLIC HIGHWAY GUARDRAIL
        // -----------------------------------------------------------------
        milestones.forEach((ms) => {
          ms.x -= busVelocity * 0.36 * dt;
          if (ms.x < -0.1) {
            ms.x = 1.18;
            ms.cityIdx = (ms.cityIdx + 1) % route.milestones.length;
          }
          const cityObj = route.milestones[ms.cityIdx % route.milestones.length];
          drawIndianMilestone(ctx, ms.x * w, roadTopY - 4, cityObj);
        });

        // Metallic W-Beam Guardrail
        const railY = roadTopY - 22;
        const postSpacing = 96;
        guardrailOffset = (guardrailOffset + busVelocity * 420 * dt) % postSpacing;

        ctx.fillStyle = '#334155';
        for (let gx = -guardrailOffset; gx < w + postSpacing; gx += postSpacing) {
          ctx.fillRect(gx, railY + 8, 6, 16);
        }

        const railGrad = ctx.createLinearGradient(0, railY, 0, railY + 13);
        railGrad.addColorStop(0, '#94a3b8');
        railGrad.addColorStop(0.35, '#cbd5e1');
        railGrad.addColorStop(0.65, '#64748b');
        railGrad.addColorStop(1, '#475569');
        ctx.fillStyle = railGrad;
        ctx.fillRect(0, railY, w, 12);

        for (let gx = -guardrailOffset; gx < w + postSpacing; gx += postSpacing) {
          ctx.fillStyle = '#f59e0b';
          ctx.fillRect(gx + 1, railY + 4, 4, 4);
        }

        // -----------------------------------------------------------------
        // LAYER 5: ASPHALT HIGHWAY, ROAD LIGHT REFLECTIONS & MONSOON RAIN
        // -----------------------------------------------------------------
        const roadGrad = ctx.createLinearGradient(0, roadTopY, 0, h);
        roadGrad.addColorStop(0, '#262930');
        roadGrad.addColorStop(0.25, '#1b1e24');
        roadGrad.addColorStop(0.75, '#12141a');
        roadGrad.addColorStop(1, '#0b0d12');
        ctx.fillStyle = roadGrad;
        ctx.fillRect(0, roadTopY, w, h - roadTopY);

        // Clean Shoulder Line
        ctx.fillStyle = 'rgba(203, 213, 225, 0.25)';
        ctx.fillRect(0, roadTopY + 3, w, 2);

        // Subtle Asphalt Grain Streaks
        asphaltStreaks.forEach((st) => {
          st.x -= busVelocity * 0.85 * dt;
          if (st.x < -0.1) st.x = 1.1;
          ctx.fillStyle = `rgba(255, 255, 255, ${st.alpha * Math.min(1.2, 0.25 + busVelocity)})`;
          ctx.fillRect(st.x * w, st.yRatio * h, st.len * (0.5 + busVelocity * 0.6), 1.2);
        });

        // Scrolling Highway Dashed Lane Markings
        roadOffset = (roadOffset + busVelocity * 720 * dt) % 220;
        const laneY = roadTopY + (h - roadTopY) * 0.46;
        ctx.fillStyle = '#d97706';
        for (let lx = -roadOffset; lx < w + 220; lx += 220) {
          ctx.fillRect(lx, laneY, 95, 3.8);
        }

        // Subtle, localized road sheen. No projected headlight cones or broad glare streaks.
        if (!isWindowSeatView) {
          const reflectY = roadTopY + (h - roadTopY) * 0.43;
          const sheen = ctx.createRadialGradient(w * 0.50, reflectY, 2, w * 0.50, reflectY, w * 0.13);
          sheen.addColorStop(0, 'rgba(214, 163, 73, 0.075)');
          sheen.addColorStop(0.55, 'rgba(180, 125, 48, 0.028)');
          sheen.addColorStop(1, 'rgba(180, 125, 48, 0)');
          ctx.fillStyle = sheen;
          ctx.beginPath();
          ctx.ellipse(w * 0.50, reflectY, w * 0.13, (h - roadTopY) * 0.13, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Rear Exhaust Smoke Puffs
        for (let i = exhaustParticles.length - 1; i >= 0; i--) {
          const p = exhaustParticles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.r += 16 * dt;
          p.life -= dt * 1.35;
          if (p.life <= 0) {
            exhaustParticles.splice(i, 1);
            continue;
          }
          const puffGrad = ctx.createRadialGradient(p.x, p.y, 1, p.x, p.y, p.r);
          puffGrad.addColorStop(0, `rgba(203, 213, 225, ${(p.alpha * p.life).toFixed(3)})`);
          puffGrad.addColorStop(1, 'rgba(148, 163, 184, 0)');
          ctx.fillStyle = puffGrad;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Bottom Foreground Bushes
        foregroundBushes.forEach((fb) => {
          fb.x -= busVelocity * 0.78 * dt;
          if (fb.x < -0.25) fb.x = 1.35;
          const fbx = fb.x * w;
          const fby = h * 0.97;
          const bushGrad = ctx.createRadialGradient(fbx, fby, 8, fbx, fby, fb.r * 1.4);
          bushGrad.addColorStop(0, 'rgba(20, 32, 22, 0.92)');
          bushGrad.addColorStop(0.6, 'rgba(15, 24, 17, 0.65)');
          bushGrad.addColorStop(1, 'rgba(10, 14, 12, 0)');
          ctx.fillStyle = bushGrad;
          ctx.beginPath();
          ctx.ellipse(fbx, fby, fb.r * 1.5, fb.r * 0.9, 0, 0, Math.PI * 2);
          ctx.fill();
        });

        // Monsoon Rain Overlay
        if (monsoonRainOn) {
          ctx.strokeStyle = 'rgba(186, 230, 253, 0.35)';
          ctx.lineWidth = 1.2;
          const windSlant = -12 - busVelocity * 16;
          raindrops.forEach((r) => {
            r.y += r.speed * dt * 0.88;
            r.x -= (0.08 + busVelocity * 0.18) * dt;
            if (r.y > 1.05) {
              r.y = -0.05;
              r.x = Math.random() * 1.2;
            }
            if (r.x < -0.1) r.x = 1.1;

            const rx = r.x * w;
            const ry = r.y * h;
            ctx.beginPath();
            ctx.moveTo(rx, ry);
            ctx.lineTo(rx + windSlant, ry + r.len);
            ctx.stroke();
          });
        }

        // Subtle Audio-Reactive Glow on Bus Windows
        if (busWindowsRow) {
          const brightness = 1 + bassEnergy * 0.22;
          busWindowsRow.style.filter = `brightness(${brightness.toFixed(2)})`;
        }

        requestAnimationFrame(animateHighway);
      }

      // Initialize UI & start animation loop
      updateGearUI();
      updateProgressUI(0, 0);
      renderPlaylistItems();
      requestAnimationFrame(animateHighway);
    })();
  </script>

  <!-- Live online counter via Supabase Realtime Presence (falls back to open tabs on this browser). -->
  <script type="module">
    // 1) Create a free project at supabase.com  2) Settings -> API: copy Project URL + anon/publishable key
    // 3) Paste them below. No tables needed: Realtime Presence works out of the box.
    const SUPABASE_URL = 'PASTE_SUPABASE_PROJECT_URL_HERE';
    const SUPABASE_PUBLISHABLE_KEY = 'PASTE_SUPABASE_PUBLISHABLE_KEY_HERE';
    const onlineCountEl = document.getElementById('onlineCount');
    const configReady = ![SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY].some(value => value.includes('PASTE_'));

    // Fallback: counts this site's tabs open in the same browser, so the badge is never an empty dash.
    function localTabCounter() {
      try {
        const id = Math.random().toString(36).slice(2);
        const bc = new BroadcastChannel('bus-wala-tabs');
        const seen = new Map();
        const beat = () => { bc.postMessage({ id, t: Date.now() }); };
        const draw = () => {
          const now = Date.now();
          for (const [k, t] of seen) if (now - t > 6000) seen.delete(k);
          onlineCountEl.textContent = String(seen.size + 1);
          onlineCountEl.title = 'Tabs open in this browser. Add Supabase keys for the real site-wide live count.';
        };
        bc.onmessage = (e) => { seen.set(e.data.id, e.data.t); draw(); };
        setInterval(() => { beat(); draw(); }, 2500);
        beat(); draw();
      } catch (_) { onlineCountEl.textContent = '1'; }
    }

    if (!configReady) {
      localTabCounter();
    } else {
      (async () => {
        try {
          const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2');
          const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
          const presenceKey = (globalThis.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : 'visitor-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2);
          const channel = supabase.channel('bus-wala-live-visitors', { config: { presence: { key: presenceKey } } });
          channel.on('presence', { event: 'sync' }, () => {
            onlineCountEl.textContent = String(Math.max(1, Object.keys(channel.presenceState()).length));
            onlineCountEl.title = 'People on the site right now';
          });
          channel.subscribe(async (status) => {
            if (status === 'SUBSCRIBED') {
              await channel.track({ online_at: new Date().toISOString(), page: 'bus-wala' });
            } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
              localTabCounter();
            }
          });
          window.addEventListener('pagehide', () => {
            channel.untrack().catch(() => {});
            supabase.removeChannel(channel).catch(() => {});
          }, { once: true });
        } catch (_) { localTabCounter(); }
      })();
    }
  </script>
